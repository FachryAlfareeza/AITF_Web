name: Deploy to GitHub Pages

# Build the Vite frontend and publish it to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Build and deployment ->
# Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions required by the Pages deploy action.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # base is '/AITF_Web/' (see frontend/vite.config.ts). If this repo is
        # ever renamed, set VITE_BASE to '/<new-repo-name>/' here.
        run: npm run build

      - name: Add SPA 404 fallback and .nojekyll
        # Copy index.html to 404.html so client-side navigation survives a
        # hard refresh/deep link, and add .nojekyll so Pages serves files
        # under _ and other Jekyll-ignored names verbatim.
        run: |
          cp frontend/dist/index.html frontend/dist/404.html
          touch frontend/dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
